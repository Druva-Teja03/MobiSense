<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobiSense - Map Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-container">

    <!-- Left side: placeholder for the real map -->
    <div class="map-box">
      Map Placeholder
    </div>

    <!-- Right side: list of detected issues -->
    <div class="sidebar" id="sidebar">
      <h2>Detected Issues</h2>

      <div class="issue-card">
        <p class="issue-type">Pothole</p>
        <p class="issue-location">MG Road, near Metro Station</p>
        <p class="issue-status">Status: Pending</p>
      </div>

      <div class="issue-card">
        <p class="issue-type">Illegal Parking</p>
        <p class="issue-location">Brigade Road, opposite Mall</p>
        <p class="issue-status">Status: Reported</p>
      </div>

      <div class="issue-card">
        <p class="issue-type">Garbage Dump</p>
        <p class="issue-location">Indiranagar 100ft Road</p>
        <p class="issue-status">Status: Resolved</p>
      </div>

    </div>

  </div>
 <script src="app.js"></script>
</body>
</html>
